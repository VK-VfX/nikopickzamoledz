name: Build Windows app

# The Windows app shares the wallpaper generators with the phone app, so it is rebuilt when those or its own
# files change, and can be run by hand. It adds Zamoled-Windows-x64.zip to the release of the current version.
on:
  push:
    branches: ['claude/hopeful-noether-lcc0fj']
    tags: ['v*']
    paths:
      - 'tools/desktop/**'
      - 'app/src/main/java/com/nikopick/zamoled/gen/**'
      - 'release-notes/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the Android framework jar
        shell: bash
        run: |
          mkdir -p tools/desktop/deps
          J=android-all-instrumented-15-robolectric-13954326-i7.jar
          curl -fL --retry 5 --retry-delay 5 -o "tools/desktop/deps/$J" \
            "https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7/$J"

      # Drawn on Windows itself, so a renderer that does not work there stops the release.
      - name: Draw test pictures on Windows
        shell: bash
        working-directory: tools/desktop
        run: bash ./gradlew test --console=plain --stacktrace

      - name: Build the Windows app
        shell: bash
        working-directory: tools/desktop
        run: bash ./gradlew distZip --console=plain --stacktrace

      - name: Keep the test pictures
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-pictures
          path: tools/desktop/build/smoke/*.png

      - name: Add to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          TAG="v$V"
          [ "${GITHUB_REF_TYPE}" = "tag" ] && TAG="${GITHUB_REF_NAME}"
          # The phone build creates the release; when both ran for this push, wait for it.
          for i in $(seq 1 40); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG ($i)"; sleep 30
          done
          gh release view "$TAG" >/dev/null || { echo "release $TAG does not exist"; exit 1; }
          gh release upload "$TAG" tools/desktop/build/release/Zamoled-Windows-x64.zip --clobber
